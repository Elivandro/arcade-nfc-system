; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Ativação física da PSRAM de 8MB (Tipo OPI / Octal no S3)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.extra_flags = -DBOARD_HAS_PSRAM

; Expansão do limite de armazenamento para 16MB de Flash
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Configuração de velocidade do Monitor Serial do VSCode
monitor_speed = 115200

; Suas Bibliotecas (O PlatformIO vai baixar sozinho ao compilar)
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit NeoPixel @ ^1.12.4